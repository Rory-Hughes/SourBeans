<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <title>SourBeans</title>
        <%-- import the default stylesheet --%>
        <link rel="stylesheet" href="../styles.css"></link>
        <%-- import the pages styles --%>
        <link rel="stylesheet" href="./index.css"></link>
    </head>
    <body>
        <div class="navbar">
            <div class="logo-wrapper">
                <img class="sourbeans-logo"/>
                <p class="logo-text">SourBeans</p>
            </div>
            <div class="nav-link-wrapper">
                <a class="nav-link">Projects</a>
                <a class="nav-link">Profile</a>
            </div>
            <div class="quick-actions">
                <button class="quick-action-button">Create Project</button>

            </div>
        </div>
        <section class="hero">
            <h1 th:text="${message}">This is where the hero will go :)</h1>

        </section>
    </body>
</html>
